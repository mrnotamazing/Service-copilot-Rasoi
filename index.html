<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf8f3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1512" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e8a03a'/%3E%3Cpath d='M11 7v8a3 3 0 0 0 3 3v7M11 7v6M14 7v6M17 7v8a3 3 0 0 1-3 3M22 7c-2 0-3 3-3 7h3v11' stroke='%23231a12' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Rasoi Service Copilot</title>
    <script>
      // Apply the saved or system theme before first paint (no flash).
      ;(function () {
        var t = 'system'
        try { t = localStorage.getItem('rasoi-theme') || 'system' } catch (e) {}
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
