<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBF8F0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0A09" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TableMate" />
    <title>TableMate: the right service, at the right time</title>
    <meta name="description" content="TableMate is an AI copilot for fine-dining servers. It shows each server the next three things that matter, keeps the kitchen and floor on the same page, and records whose step every delay really was." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TableMate" />
    <meta property="og:title" content="TableMate: every table on time, no one blamed for what was never theirs" />
    <meta property="og:description" content="An AI copilot for fine-dining servers: the next three moves, a shared picture for kitchen and floor, and delays credited to whoever controlled them." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved or system theme before first paint (no flash).
      ;(function () {
        var t = 'system'
        try { t = localStorage.getItem('tablemate-theme') || 'system' } catch (e) {}
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
    <script>
      // If the app cannot even start (a failed update, a stale dev server), say so instead of showing a blank page.
      ;(function () {
        var seen = []
        window.addEventListener('error', function (e) { seen.push(String(e.message || (e.target && e.target.src) || 'error')) }, true)
        window.addEventListener('unhandledrejection', function (e) { seen.push(String((e.reason && e.reason.message) || e.reason)) })
        setTimeout(function () {
          var root = document.getElementById('root')
          if (!root || root.childElementCount) return
          var box = document.createElement('div')
          box.setAttribute('role', 'alert')
          box.style.cssText = 'font-family:system-ui,sans-serif;max-width:34rem;margin:15vh auto;padding:1.5rem;color:#34251d'
          box.innerHTML = '<h1 style="font-size:1.6rem;margin:0 0 .5rem">TableMate could not start</h1><p style="line-height:1.5;color:#7a6658">Try: stop the app, run <b>npm install</b> then <b>npm run dev</b>, and refresh this page (Cmd/Ctrl + Shift + R). If it still does not open, reset this site\'s saved data in the browser, or send the message below.</p><pre style="white-space:pre-wrap;background:#f3ece0;padding:.75rem;border-radius:.75rem;font-size:.8rem"></pre>'
          box.querySelector('pre').textContent = seen.slice(0, 4).join('\n') || 'No error was reported. Check the terminal where the app is running.'
          document.body.appendChild(box)
        }, 6000)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
